name: Python Tests (Windows)

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Windows のロングパス対策
          config: core.longpaths=true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up JDK 17 (FFDec用)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install uv
        run: irm https://astral.sh/uv/install.ps1 | iex

      - name: Install dependencies
        run: uv sync

      - name: Setup FFDec and Update PATH
        shell: pwsh
        run: |
          if (!(Test-Path "ffdec")) { mkdir ffdec }
          # バージョンを 25.1.0 に統一（必要に応じて変更してください）
          Invoke-WebRequest -Uri "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version25.1.0/ffdec_25.1.0.zip" -OutFile "ffdec.zip"
          Expand-Archive -Path "ffdec.zip" -DestinationPath "ffdec" -Force
          
          # GitHub Actions の PATH に追加
          echo "${{ github.workspace }}\ffdec" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run pytest
        run: uv run pytest