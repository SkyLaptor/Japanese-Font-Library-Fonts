# ==========================================
# SWF一括埋め込み用レシピファイル例
#   1フォントファミリー毎に用意するのをお勧めします。
#   【任意】と付いた設定値はコメントアウトすることでデフォルト値が使用されます。
#   注意:
#     ファイルパス類は、区切り文字はバッククォート(\)ではなく、スラッシュ (/) を使用してください
#     1ファイルにあまりにも大量にフォントを詰め込むと、スカイリムがCTDする危険が高くなります。
#     埋め込みフォントファイルはTTFの他にOTFも使用可能ですが、内部にてTTF変換処理が行われるため処理に時間がかかります。
#       事前にTTF変換してからレシピファイルに記載することをお勧めします。
# ==========================================

# ------------------------------------------
# パス基準設定
# ------------------------------------------
input_dir: "assets/fonts" # 埋め込みフォントといった入力系パスを相対指定した場合、これが基準となります。UI側で指定した場合はそちらが優先されます。
output_dir: "assets/fonts" # SWF出力先といった出力系パスを相対指定した場合、これが基準となります。UI側で指定した場合はそちらが優先されます。

# ------------------------------------------
# グローバル設定
#   処理ステップ側で同名のパラメーターを指定している場合、そちらが優先されます。
# ------------------------------------------
#output_swf_path: "" # 【必須】出力SWFのパス 出力形式はSWF固定です。ステップ側で指定することをお勧めします。

# ------------------------------------------
# 処理ステップ
# ------------------------------------------
steps:
    - output_swf_path: "preset/fonts_modern_preset.swf"
      embed_fonts: # 【必須】埋め込むフォントのリスト
      - input_font_path: "hackgen-mono/mono.ttf"
        internal_font_name: "hackgen_mono"
      - input_font_path: "mplus/every.ttf"
        internal_font_name: "mplus_every"
      - input_font_path: "mplus/every_w70.ttf"
        internal_font_name: "mplus_every_w70"
      - input_font_path: "mplus/every_w50.ttf"
        internal_font_name: "mplus_every_w50"
      - input_font_path: "skyrim-jp-book/book.ttf"
        internal_font_name: "skyrim-jp-book_book"
      - input_font_path: "skyrim-jp-handwrite/handwrite.ttf"
        internal_font_name: "skyrim-jp-handwrite_handwrite"

    # 軽量版
    - output_swf_path: "preset/fonts_modern_preset_lw.swf"
      embed_fonts: # 【必須】埋め込むフォントのリスト
      - input_font_path: "hackgen-mono/mono_lw.ttf"
        internal_font_name: "hackgen_mono"
      - input_font_path: "mplus/every_lw.ttf"
        internal_font_name: "mplus_every"
      - input_font_path: "mplus/every_w70_lw.ttf"
        internal_font_name: "mplus_every_w70"
      - input_font_path: "mplus/every_w50_lw.ttf"
        internal_font_name: "mplus_every_w50"
      - input_font_path: "skyrim-jp-book/book_lw.ttf"
        internal_font_name: "skyrim-jp-book_book"
      - input_font_path: "skyrim-jp-handwrite/handwrite_lw.ttf"
        internal_font_name: "skyrim-jp-handwrite_handwrite"
