# ==========================================
# SWF一括埋め込み用レシピファイル例
#   1フォントファミリー毎に用意するのをお勧めします。
#   【任意】と付いた設定値はコメントアウトすることでデフォルト値が使用されます。
#   注意:
#     ファイルパス類は、区切り文字はバッククォート(\)ではなく、スラッシュ (/) を使用してください
#     1ファイルにあまりにも大量にフォントを詰め込むと、スカイリムがCTDする危険が高くなります。
#     埋め込みフォントファイルはTTFの他にOTFも使用可能ですが、内部にてTTF変換処理が行われるため処理に時間がかかります。
#       事前にTTF変換してからレシピファイルに記載することをお勧めします。
# ==========================================

# ------------------------------------------
# パス基準設定
# ------------------------------------------
input_dir: "contents" # 埋め込みフォントといった入力系パスを相対指定した場合、これが基準となります。UI側で指定した場合はそちらが優先されます。
output_dir: "contents" # SWF出力先といった出力系パスを相対指定した場合、これが基準となります。UI側で指定した場合はそちらが優先されます。

# ------------------------------------------
# グローバル設定
#   処理ステップ側で同名のパラメーターを指定している場合、そちらが優先されます。
# ------------------------------------------
#output_swf_path: "" # 【必須】出力SWFのパス 出力形式はSWF固定です。ステップ側で指定することをお勧めします。

# ------------------------------------------
# 処理ステップ
# ------------------------------------------
steps:
    - output_swf_path: "nicomojiplus/fonts_nicomojiplus.swf"
      embed_fonts: # 【必須】埋め込むフォントのリスト
      - input_font_path: "nicomojiplus/every.ttf" # 【必須】埋め込むフォントのパス
        internal_font_name: "nicomojiplus_every" # 【必須】内部フォント名 fontconfig.txt のマップ設定にて実際に使用する名前となります。名前の重複を防ぐため、フォントファミリー名_サイズなどフォントを特定できるような名前にすることを強く推奨します。
      - input_font_path: "nicomojiplus/every_w70.ttf"
        internal_font_name: "nicomojiplus_every_w70"
      - input_font_path: "nicomojiplus/every_w50.ttf"
        internal_font_name: "nicomojiplus_every_w50"
      - input_font_path: "nicomojiplus/book.ttf"
        internal_font_name: "nicomojiplus_book"
      - input_font_path: "nicomojiplus/handwrite.ttf"
        internal_font_name: "nicomojiplus_handwrite"
    # 軽量版
    - output_swf_path: "nicomojiplus/fonts_nicomojiplus_lw.swf"
      embed_fonts: # 【必須】埋め込むフォントのリスト
      - input_font_path: "nicomojiplus/every_lw.ttf" # 【必須】埋め込むフォントのパス
        internal_font_name: "nicomojiplus_every" # 【必須】内部フォント名 fontconfig.txt のマップ設定にて実際に使用する名前となります。名前の重複を防ぐため、フォントファミリー名_サイズなどフォントを特定できるような名前にすることを強く推奨します。
      - input_font_path: "nicomojiplus/every_w70_lw.ttf"
        internal_font_name: "nicomojiplus_every_w70"
      - input_font_path: "nicomojiplus/every_w50_lw.ttf"
        internal_font_name: "nicomojiplus_every_w50"
      - input_font_path: "nicomojiplus/book_lw.ttf"
        internal_font_name: "nicomojiplus_book"
      - input_font_path: "nicomojiplus/handwrite_lw.ttf"
        internal_font_name: "nicomojiplus_handwrite"