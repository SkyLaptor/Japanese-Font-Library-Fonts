# ==========================================
# SWF一括埋め込み用レシピファイル例
#   これをコピーして利用して下さい。
#   1フォントファミリー毎に用意するのをお勧めします。
#   【任意】と付いた設定値はコメントアウトすることでデフォルト値が使用されます。
#   注意:
#     ファイルパス類は、区切り文字はバッククォート(\)ではなく、スラッシュ (/) を使用してください
#     1ファイルにあまりにも大量にフォントを詰め込むと、スカイリムがCTDする危険が高くなります。
#     埋め込みフォントファイルはTTFの他にOTFも使用可能ですが、内部にてTTF変換処理が行われるため処理に時間がかかります。
#       事前にTTF変換してからレシピファイルに記載することをお勧めします。
# ==========================================

# ------------------------------------------
# パス基準設定
# ------------------------------------------
input_dir: "contents" # 埋め込みフォントといった入力系パスを相対指定した場合、これが基準となります。UI側で指定した場合はそちらが優先されます。
output_dir: "contents" # SWF出力先といった出力系パスを相対指定した場合、これが基準となります。UI側で指定した場合はそちらが優先されます。

# ------------------------------------------
# グローバル設定
#   処理ステップ側で同名のパラメーターを指定している場合、そちらが優先されます。
# ------------------------------------------
#なし

# ------------------------------------------
# 処理ステップ
# ------------------------------------------
steps:
    - output_swf_path: "template/fonts_template.swf" # 【必須】SWF出力先のパス
      embed_fonts: # 【必須】埋め込むフォントのリスト
      - input_font_path: "template/every.ttf" # 【必須】埋め込むフォントのパス
        internal_font_name: "template_every" # 【必須】内部フォント名 fontconfig.txt のマップ設定にて実際に使用する名前となります。名前の重複を防ぐため、フォントファミリー名_サイズなどフォントを特定できるような名前にすることを強く推奨します。
      - input_font_path: "template/book.ttf"
        internal_font_name: "template_book"
      - input_font_path: "template/handwrite.ttf"
        internal_font_name: "template_handwrite"
    - output_swf_path: "template/fonts_template_lw.swf"
      embed_fonts:
      - input_font_path: "template/every_lw.ttf"
        internal_font_name: "template_every"
      - input_font_path: "template/book_lw.ttf"
        internal_font_name: "template_book"
      - input_font_path: "template/handwrite_lw.ttf"
        internal_font_name: "template_handwrite"