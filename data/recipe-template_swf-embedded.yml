# TODO
# ==========================================
# SWF一括埋め込み用レシピファイル例
#   1SWF毎に用意します。1SWFに1フォント埋め込みにするか、1SWFに同一フォントファミリーの複数のバリエーションを埋め込むことを推奨します。
#   【任意】と付いた設定値はコメントアウトすることでデフォルト値が使用されます。
#   注意:
#     ファイルパス類は、区切り文字はバッククォート(\)ではなく、スラッシュ (/) を使用してください
#     1ファイルにあまりにも大量にフォントを詰め込むと、スカイリムがCTDする危険が高くなります。
#     埋め込みフォントファイルはTTFの他にOTFも使用可能ですが、内部にてTTF変換処理が行われるため処理に時間がかかります。
#       事前にTTF変換してからレシピファイルに記載することをお勧めします。
# ==========================================

# ------------------------------------------
# パス基準設定
# ------------------------------------------
input_dir: "assets/fonts" # 埋め込みフォントといった入力系パスを相対指定した場合、これが基準となります。UI側で指定した場合はそちらが優先されます。
output_swf_path: "build/fonts_apricot.swf" # 【必須】SWF出力先のパス 出力形式はSWF固定です。UI側で指定した場合はそちらが優先されます。スカイリムの慣例的に、ファイル名の先頭にfonts_を付けます。

# ------------------------------------------
# グローバル設定
#   処理ステップ側で同名のパラメーターを指定している場合、そちらが優先されます。
# ------------------------------------------
# なし

# ------------------------------------------
# 埋め込みフォントファイル
# ------------------------------------------
embeds:
    - input_font_path: "apricot/every.ttf" # 【必須】埋め込むフォントファイル。
      internal_font_name: "apricot_every" # 【必須】内部フォント名 fontconfig.txt のマップ設定にて実際に設定する名前となります。名前の重複を防ぐため、フォントファミリー名_サイズなどフォントを特定できるような名前にすることを推奨します。
    - input_font_path: "apricot/book.ttf"
      internal_font_name: "apricot_book"
    - input_font_path: "apricot/handwrite.ttf"
      internal_font_name: "apricot_handwrite"
