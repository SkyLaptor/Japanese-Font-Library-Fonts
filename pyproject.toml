[project]
name = "tesvfontforge"
version = "1.0.0"
description = "The ultimate batch font processor for Skyrim."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fonttools>=4.61.1",
    "otf2ttf>=0.2",
    "Pillow>=11.0.0",
    "PyQt6>=6.9.1",
    "pyyaml>=6.0.2",
    "skia-pathops>=0.9.1",
    "pydantic>=2.0.0",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
